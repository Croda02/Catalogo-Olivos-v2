<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#31472d" />
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/detail-insights.css" />
  <link rel="stylesheet" href="/decision-center.css" />
  <title>Casa Olivo — Panel del negocio</title>
</head>
<body class="admin-body">
  <div id="toast" class="toast" aria-live="polite"></div>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar">
      <a class="brand admin-brand" href="index.html">
        <span class="brand-mark">❧</span>
        <span><strong>Casa Olivo</strong><small>Panel del negocio</small></span>
      </a>
      <nav class="admin-nav" id="adminNav">
        <button data-view="dashboard" class="active"><span>⌂</span>Resumen</button>
        <button data-view="decisions"><span>◎</span>Centro de decisiones</button>
        <button data-view="products"><span>□</span>Productos</button>
        <button data-view="promotions"><span>◇</span>Promociones</button>
        <button data-view="customers"><span>♙</span>Clientes</button>
        <button data-view="analytics"><span>▥</span>Estadísticas</button>
        <button data-view="settings"><span>⚙</span>Configuración</button>
      </nav>
      <div class="admin-side-note">
        <strong>Catálogo Comercial</strong>
        <span id="planUsage">0 de 60 productos</span>
        <div class="usage-bar"><i id="usageFill"></i></div>
      </div>
      <a class="preview-link" href="index.html" target="_blank">↗ Ver catálogo público</a>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button id="sidebarToggle" class="sidebar-toggle">☰</button>
        <div class="admin-search"><span>⌕</span><input id="adminSearch" placeholder="Buscar en productos..." /></div>
        <div class="admin-user"><div class="avatar">CO</div><div><strong>Casa Olivo</strong><small>Propietario</small></div></div>
      </header>
      <main id="adminContent" class="admin-content"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <script src="/store.js"></script>
  <script src="/admin.js"></script>
  <script src="/admin-insights.js"></script>
  <script src="/decision-engine.js"></script>
  <script src="/decision-ui.js"></script>
</body>
</html>
